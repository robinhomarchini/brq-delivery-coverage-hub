name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-checks:
    name: Security Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CSP script-src
        run: |
          if grep -E "script-src.*unsafe-inline" src/proxy.ts next.config.ts; then
            echo "CSP script-src must not contain unsafe-inline. Use nonce-based scripts."
            exit 1
          fi
          if ! grep -q "nonce-" src/proxy.ts; then
            echo "CSP proxy must set a script nonce."
            exit 1
          fi

      - name: Check changed migrations for hardcoded test data
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
            changed_files=$(git diff --name-only "$base_ref"...HEAD -- supabase/migrations || true)
          else
            changed_files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/migrations || true)
          fi

          if [ -z "$changed_files" ]; then
            echo "No migration changes to scan."
            exit 0
          fi

          if echo "$changed_files" | xargs grep -nE "robinson\.marchini|acoelho|test@brq|demo@brq|password\s*=|secret\s*="; then
            echo "Hardcoded user/test data found in changed migrations."
            exit 1
          fi

      - name: Check service role exposure
        run: |
          if grep -E "^SUPABASE_SERVICE_ROLE_KEY=" .env.example .env.production 2>/dev/null; then
            echo "SUPABASE_SERVICE_ROLE_KEY must not be exposed in versioned env files."
            exit 1
          fi

      - name: Check .env.local is ignored
        run: |
          grep -q "\.env\.local" .gitignore

  quality-checks:
    name: Code Quality & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:security
      - run: npm run test:performance
      - run: npm run build

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [security-checks, quality-checks]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.security-checks.result }}" != "success" ] || [ "${{ needs.quality-checks.result }}" != "success" ]; then
            echo "Security or quality gates failed."
            exit 1
          fi
          echo "All security and quality gates passed."
