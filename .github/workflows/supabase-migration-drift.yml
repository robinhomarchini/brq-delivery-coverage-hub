name: Supabase Migration Drift

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 08:00 America/Sao_Paulo.
    - cron: "0 11 * * 1-5"

permissions:
  contents: read

jobs:
  check:
    name: Check migration history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase migration check secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error title=Missing SUPABASE_DB_URL secret::Configure repository secret SUPABASE_DB_URL with the Supabase Postgres connection string. Without it, this scheduled check cannot read remote migration history."
            exit 1
          fi

      - name: Check Supabase migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrations:check
