project: BRQ Delivery Coverage Hub
baseline: v0.0.0
stack: Next.js 16, React 19, TypeScript, Supabase, Vercel
canonical_docs: docs/project
specs: specs
database:
  source_of_truth: Supabase/Postgres
  migrations: forward-only
  access: DeliveryRepository -> BFF/RPC -> RLS
quality:
  default: npm run validate
  build: npm run build
  persistence: npm run smoke:critical
  database: npm run db:migrations:check
retention:
  active_handoff_days: 15
  history_source: git
